[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tape-data-product"
version = "0.1.0"
description = "Direction-neutral equity tape measurements and causal interval retrieval"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "duckdb>=1.4,<2", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "psutil>=5.9", "python-dotenv>=1.0", "certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
