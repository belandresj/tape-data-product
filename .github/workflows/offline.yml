name: Offline package reproduction
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools==80.9.0
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: python -m pip install --require-hashes -r config/vps-python313-linux.lock
      - run: python -m pip install --no-deps dist/*.whl
      - name: Verify V2 contracts, replay, and feature calculation
        run: >-
          python -B scripts/measure.py output/ci-core-tests.json
          python -B -m pytest -q
          tests/test_publication_surface.py
          tests/test_acquisition_stage.py
          tests/test_endpoint_contracts.py
          tests/test_columnar_validation.py
          tests/test_raw_replay_optimization.py
          tests/test_endpoint_pipeline.py
          tests/test_endpoint_ew_batch_optimization.py
          -k
          "not one_worker_plan and not parallel_runner and not aggregate_rss_limit
          and not worker_failure and not abrupt_worker_death and not parent_interruption"
      - name: Verify bounded calculation-runner controls
        run: >-
          python -B scripts/measure.py output/ci-runner-tests.json
          python -B -m pytest -q
          tests/test_endpoint_pipeline.py::test_one_worker_plan_executes_base_then_features
          tests/test_endpoint_pipeline.py::test_aggregate_rss_limit_stops_all_active_members
      - name: Verify endpoint queries and V2 report analysis
        run: >-
          python -B scripts/measure.py output/ci-query-report-tests.json
          python -B -m pytest -q
          tests/test_endpoint_reader.py
          tests/test_endpoint_database.py
          tests/test_endpoint_query_core.py
          tests/test_endpoint_distributions.py
          tests/test_endpoint_joint_preview.py
          tests/test_endpoint_joint_expanded.py
          tests/test_activity_definition_ecdf.py
          tests/test_main_feature_ecdf.py
          tests/test_endpoint_population.py
          tests/test_gpus_cast_comparison.py
          tests/test_structured_tape_episodes.py
          tests/test_structured_tape_windows.py
          tests/test_v2_smoke.py
      - run: python -c "import matplotlib.font_manager"
        env:
          MPLBACKEND: Agg
      - name: Verify installed V2 CLI surface
        run: |
          cd "$(mktemp -d)"
          tape-product --help
          tape-product features --help
          tape-product endpoint-data --help
          tape-product report --help
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
