name: Offline package reproduction
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -B scripts/measure.py output/ci-tests.json python -B -m pytest -q
      - run: python -B scripts/measure.py output/ci-demo.json tape-product demo --output output/ci-demo
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
