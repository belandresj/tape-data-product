name: Offline package reproduction
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools==80.9.0
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: python -m pip install --require-hashes -r config/vps-python313-linux.lock
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -B scripts/measure.py output/ci-tests.json python -B -m pytest -q
      - run: python -c "import matplotlib.font_manager"
        env:
          MPLBACKEND: Agg
      - run: |
          checkout="$PWD"
          cd "$(mktemp -d)"
          python -B "$checkout/scripts/measure.py" "$checkout/output/ci-demo.json" \
            python -B "$checkout/scripts/offline_run.py" --forbid "$checkout" -- demo --output demo
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
